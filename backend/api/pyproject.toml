[project]
name = "api"
version = "0.2.0"
description = "Ajapopaja Build FastAPI API"
authors = []
dependencies = [
  "fastapi>=0.100.0",
  "uvicorn>=0.23.0",
  "core",
  "websockets>=16.0",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "python-multipart>=0.0.6",
  "ollama>=0.6.1",
  "msgpack>=1.1.2",
  "gitpython>=3.1.46",
]
requires-python = ">=3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
core = { workspace = true }

[tool.ruff]
line-length = 88

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
