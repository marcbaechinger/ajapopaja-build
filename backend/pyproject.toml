[tool.uv]
workspace = { members = ["core", "api", "mcp"] }

[project]
name = "ajapopaja-backend"
version = "0.1.0"
description = "Ajapopaja Build Backend Workspace"
requires-python = ">=3.11"
dependencies = [
    "api",
    "ajapopaja-mcp",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mongomock-motor>=0.0.36",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-watch>=4.2.0",
    "ruff>=0.15.12",
]

[tool.uv.sources]
api = { workspace = true }
ajapopaja-mcp = { workspace = true }
core = { workspace = true }

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"] # Error, Pyflakes, Isort
ignore = ["E712"] # Ignore equality comparison to True/False for Beanie/SQLAlchemy

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
