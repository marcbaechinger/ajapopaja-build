services:
  ajapopaja-build:
    image: ajapopaja-build:latest
    # Instance identity. Defaults keep the production deployment unchanged;
    # staging overrides them from its own env file (see deploy/staging.env.example).
    container_name: ${CONTAINER_NAME:-ajapopaja-build}
    restart: always
    # Runtime variables for the container. The path is resolved from the
    # *interpolation* environment (the systemd unit's EnvironmentFile), so each
    # instance forwards its own env file into its own container.
    env_file:
      - ${AJAPOPAJA_ENV_FILE:-/etc/ajapopaja-build.env}
    # Publish on loopback only. nginx on the host is the single entry point
    # (see deploy/ajapopaja-nginx.conf), so the API and dev-server ports stay off
    # the LAN/WiFi and off Docker's IPv6 publishing while remaining reachable
    # from the host itself (and therefore from nginx) on 127.0.0.1.
    ports:
      - "127.0.0.1:${PORT:-8081}:${PORT:-8081}"
      - "127.0.0.1:${DEV_SERVER_PORT:-1224}:${DEV_SERVER_PORT:-1224}"
    volumes:
      # Single repos root — the only host source tree exposed to the container.
      # Mounted 1:1 so host and container paths stay identical (paths are
      # persisted by the data models). Never mount an entire home directory.
      - ${WORKSPACES_ROOT:-/home/marc-baechinger/monolit/code}:${WORKSPACES_ROOT:-/home/marc-baechinger/monolit/code}
      # Editor socket (a single socket file, not a directory tree).
      - /tmp/nvimsocket:/tmp/nvimsocket
      # Per-instance writable roots. Host and container paths MUST be identical:
      # Pi sessions and the data models persist absolute paths.
      - ${PI_SESSIONS_ROOT:-/data/ajapopaja/pi_sessions}:${PI_SESSIONS_ROOT:-/data/ajapopaja/pi_sessions}
      - ${SANDBOX_ROOT:-/data/ajapopaja/sandboxes}:${SANDBOX_ROOT:-/data/ajapopaja/sandboxes}
      - ${REMOTE_WORKSPACES_ROOT:-/data/ajapopaja/remote_workspaces}:${REMOTE_WORKSPACES_ROOT:-/data/ajapopaja/remote_workspaces}
    extra_hosts:
      - "host.docker.internal:host-gateway"
