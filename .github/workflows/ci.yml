name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:6.0
        # No host port mapping: the job container reaches this service via
        # the Docker network hostname "mongodb", not localhost. (A published
        # host port 27017 collides with the native mongod already running on
        # this machine.)
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: cd backend && uv sync
      - name: Run tests
        env:
          WORKSPACES_ROOT: /tmp
          MONGODB_URI: mongodb://mongodb:27017
          DATABASE_NAME: test_db
        run: cd backend && uv run pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: cd frontend && npm install
      - name: Run lint and build
        run: cd frontend && npm run build
      - name: Run tests
        run: cd frontend && npm run test

  license-compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install license checker
        run: npm install -g license-checker
      - name: JS License Audit
        run: cd frontend && npm run license-check
      - name: Python License Audit
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          cd backend && uv sync
          uv run pip install pip-licenses
          uv run pip-licenses --summary --order=license
