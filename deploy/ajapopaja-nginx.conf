# Ajapopaja Build - friendly hostnames via nginx reverse proxy (ALTERNATIVE).
#
# This is the nginx alternative to the /etc/hosts approach installed by
# scripts/setup-hostnames.sh. Use it if you do not want entries in /etc/hosts
# (e.g. the app needs to be reachable from other machines on the LAN, or you
# prefer a single server_name-driven routing table).
#
# Install (requires nginx on the Host):
#   sudo cp deploy/ajapopaja-nginx.conf /etc/nginx/conf.d/ajapopaja.conf
#   sudo nginx -t && sudo nginx -s reload
# Remove again:
#   sudo rm /etc/nginx/conf.d/ajapopaja.conf && sudo nginx -s reload
#
# Note: when both this proxy (port 80) and the /etc/hosts entries are active,
# http://ajapopaja is served by nginx and forwarded to 127.0.0.1:8081 —
# the result is the same. Keep only one mechanism for easier mental models.

server {
    listen 80;
    server_name ajapopaja;
    location / {
        proxy_pass http://127.0.0.1:8081;

        # WebSocket support (the app pushes live pipeline/task updates).
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard headers.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep long-lived WebSocket connections alive.
        proxy_read_timeout 86400;
    }
}

server {
    listen 80;
    server_name ajapopaja.stage;
    location / {
        proxy_pass http://127.0.0.1:8082;

